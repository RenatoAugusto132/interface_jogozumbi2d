<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Zumbi 2D</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <a href = "#principal" class = "skip-link">
        Pular para o conteúdo principal
    </a>

    <header class = "site-header">    
        
        <nav class = "navbar navbar-expand-md navbar-dark" aria-label="Navegacao principal">  
            <div class="container">
                <a class = "navbar-brand fw-bold" href = "#menu">
                    Jogo Zumbi 2D
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao"
                 aria-expanded="false" aria-label="Abrir ou fechar menu">
                 <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacao">
                    <ul class="navbar-nav ms-auto gap-md-3">
                        <li class="nav-item">
                            <a class="nav-link" href="#inicio">
                                Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#historia">
                                Historia
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#como-jogar">
                                Como Jogar
                            </a>
                        </li>
                    </ul>
                    <button type="button" id="botao-contraste" class="btn btn-outline-light ms-md-3 mt-3 mt-md-0">
                        Alto contraste: Desativado

                    </button>
                </div>
            </div> 
        </nav>
    </header>

    <main id = "principal">
        <section id = "Inicio" class="hero py-5" aria-labelledby="titulo-principal">
            <div class="container">
                <div class = "row justify-content-center">
                    <div class = "col-12 col-lg-9 text-center py-4">
                        <h1 id="titulo-principal" class="display-4 fw-bold">
                            Jogo Zumbi 2D
                        </H1>
                        <p id = "destaque fw-bold">
                            SOBREVIVA AO APOCALIPSE
                        </p>
                        <p class="lead my-4">
                            Você foi levado ao futuro,
                            onde a Terra foi dominada
                            por zumbis.
                        </p>
                         <a href="#como-jogar"
                           class="btn btn-tema btn-lg">
                           Como jogar
                        </a>

                    </div>
                </div>
            </div>

            
        </section>

        <section 
        id="configuracoes"
        aria-labelledby="titulo-configuracoes"
        class="my-5">


        <h2 id="titulo-configuracoes" class="mb-4">
            Configurações de acessibilidade

        </h2>

        <div class="card card-zumbi">
            <div class="card-body">
                
                <div class="form-check form-switch mb-4">
                    <input 
                        type="checkbox" 
                        class="form-check-input" 
                        role="switch"
                        id="alto-contraste">

                    <label 
                    for="alto-contraste"
                    class="form-check-label">
                        Ativar alto contraste
                    </label>
                </div>

                <div class="form-check form-switch mb-4">
                    <input 
                        type="checkbox" 
                        class="form-check-input" 
                        role="switch"
                        id="texto-grande">

                    <label 
                    for="texto-grande"
                    class="form-check-label">
                        Ativar tamanho do texto grande
                    </label>
                </div>

                <div class="form-check form-switch">
                    <input 
                        type="checkbox" 
                        class="form-check-input" 
                        role="switch"
                        id="reduzir-movimento">

                    <label 
                    for="reduzir-movimento"
                    class="form-check-label">
                        Reduzir animações
                    </label>
                </div>


                    </label>
                </div>


            </div>
        </section>


    </main>
    <p id="mensagem-sistema"
    class="visually-hidden"
     role="status"
    aria-live="polite"></p>





    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <script src="/script.js"></script>
</body>
</html>
