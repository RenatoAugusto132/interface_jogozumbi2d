<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Jogo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="site-header">

        <nav class="navbar navbar-expand-lg navbar-dark"
             aria-label="Navegação principal">

            <div class="container">

                <a class="navbar-brand fw-bold"
                   href="./index.html">
                    Jogo Zumbi 2D
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuNavegacao"
                    aria-controls="menuNavegacao"
                    aria-expanded="false"
                    aria-label="Abrir ou fechar menu">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse"
                     id="menuNavegacao">

                    <ul class="navbar-nav ms-auto gap-lg-3">

                        <li class="nav-item">
                            <a class="nav-link "
                               href="./index.html">
                                Início
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               href="./historia.html">
                                História
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="./como-jogar.html">
                                Como jogar
                            </a>
                        </li>


                        

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="principal" class="container py-5">

    <section aria-labelledby="titulo-download"
             class="text-center">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-9">

                <h1 id="titulo-download"
                    class="display-5 fw-bold mb-3">
                    Baixar Jogo Zumbi 2D
                </h1>

                <p class="lead mb-4">
                    Assista à demonstração do jogo
                    e prepare-se para sobreviver.
                </p>

                
                <figure class="mb-4">

                    <div class="ratio ratio-16x9">
                        <video
                            autoplay
                            muted
                            
                            playsinline
                            controls
                            preload="auto">

                            <source
                                src="/assets/videogameplay.mp4"
                                type="video/mp4">

                            Seu navegador não suporta vídeos HTML5.
                        </video>
                    </div>

                    <figcaption id="descricao-gameplay"
                                class="mt-3">

                        Demonstração da gameplay:
                        movimentação do personagem,
                        tiros e zumbis perseguindo
                        o jogador.

                    </figcaption>

                </figure>

                
                <div class="row justify-content-center">

                    <div class="col-12 col-md-9 col-lg-8">

                        <a
                            href="./assets/JOGO.mp4"
                            class="btn btn-tema btn-download
                            btn-lg w-100 py-3 px-4"
                            download="Gameplay-Jogo-Zumbi-2D.mp4">

                             DOWNLOAD

                        </a>

                    </div>

                </div>

                

            </div>
        </div>

    </section>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>

    <script src="./script.js"></script>
</body>
</html>
